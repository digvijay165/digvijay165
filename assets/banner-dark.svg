<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Digvijay Singh, student and front-end developer from Kota, India">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#131c3a"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.35"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <circle cx="980" cy="40" r="300" fill="url(#g1)"/>
    <circle cx="120" cy="330" r="260" fill="url(#g2)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="24" fill="none" stroke="#1e293b"/>

  <!-- intro -->
  <text x="72" y="96" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" fill="#38bdf8">~/digvijay165 <tspan fill="#94a3b8">$ whoami</tspan></text>
  <text x="70" y="168" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-1">Digvijay Singh</text>
  <rect x="72" y="188" width="132" height="5" rx="2.5" fill="url(#ink)"/>
  <text x="72" y="232" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#cbd5e1">Student &amp; front-end developer · Kota, India</text>
  <text x="72" y="270" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#94a3b8">&gt; building web apps people actually use<tspan fill="#38bdf8">▍<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <!-- orbit + code window -->
  <g transform="translate(930 160)">
    <ellipse rx="190" ry="62" fill="none" stroke="#6366f1" stroke-opacity="0.35" stroke-dasharray="3 7" transform="rotate(-14)"/>
    <ellipse rx="150" ry="118" fill="none" stroke="#38bdf8" stroke-opacity="0.22" transform="rotate(24)"/>
    <circle r="6" fill="#38bdf8">
      <animateMotion dur="9s" repeatCount="indefinite" path="M190 0 A190 62 0 1 1 -190 0 A190 62 0 1 1 190 0" rotate="0"/>
    </circle>
  </g>
  <g transform="translate(800 78)">
    <rect width="260" height="168" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <path d="M0 14 a14 14 0 0 1 14 -14 h232 a14 14 0 0 1 14 14 v16 h-260 z" fill="#1e293b"/>
    <circle cx="20" cy="15" r="5" fill="#ff5f57"/><circle cx="38" cy="15" r="5" fill="#febc2e"/><circle cx="56" cy="15" r="5" fill="#28c840"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14">
      <text x="20" y="62"><tspan fill="#a78bfa">const</tspan><tspan fill="#f8fafc"> dev</tspan><tspan fill="#94a3b8"> = {</tspan></text>
      <text x="38" y="86"><tspan fill="#cbd5e1">stack</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#38bdf8">"React + TS"</tspan><tspan fill="#94a3b8">,</tspan></text>
      <text x="38" y="110"><tspan fill="#cbd5e1">server</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#38bdf8">"Node"</tspan><tspan fill="#94a3b8">,</tspan></text>
      <text x="38" y="134"><tspan fill="#cbd5e1">openTo</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#38bdf8">"internships"</tspan></text>
      <text x="20" y="156" fill="#94a3b8">}</text>
    </g>
  </g>
</svg>
