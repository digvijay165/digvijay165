<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="redis-cli talking to mini-redis: PING, SET, INCR and EXPIRE, next to 320k+ requests per second, 39 commands and 68 tests">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#131c3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.22"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="960" height="600" fill="url(#bg)"/>
  <rect width="960" height="600" fill="url(#dots)"/>
  <circle cx="860" cy="80" r="300" fill="url(#glow)"/>

  <!-- terminal window -->
  <rect x="32.5" y="32.5" width="895" height="535" rx="16" fill="#0f172a" fill-opacity="0.92" stroke="#1e293b"/>
  <path d="M33 80H927" stroke="#1e293b"/>
  <circle cx="62" cy="57" r="7" fill="#ff5f57"/>
  <circle cx="86" cy="57" r="7" fill="#febc2e"/>
  <circle cx="110" cy="57" r="7" fill="#28c840"/>
  <text x="480" y="63" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#94a3b8">redis-cli -p 6379  ·  mini-redis (Java 21)</text>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="24">
    <text x="64" y="138"><tspan fill="#38bdf8">127.0.0.1:6379&gt;</tspan><tspan fill="#f8fafc"> PING</tspan></text>
    <text x="64" y="178" fill="#94a3b8">PONG</text>
    <text x="64" y="230"><tspan fill="#38bdf8">127.0.0.1:6379&gt;</tspan><tspan fill="#f8fafc"> SET lang Java</tspan></text>
    <text x="64" y="270" fill="#94a3b8">OK</text>
    <text x="64" y="322"><tspan fill="#38bdf8">127.0.0.1:6379&gt;</tspan><tspan fill="#f8fafc"> INCR visits</tspan></text>
    <text x="64" y="362" fill="#94a3b8">(integer) 1</text>
    <text x="64" y="414"><tspan fill="#38bdf8">127.0.0.1:6379&gt;</tspan><tspan fill="#f8fafc"> EXPIRE lang 60</tspan></text>
    <text x="64" y="454" fill="#94a3b8">(integer) 1</text>
    <text x="64" y="506"><tspan fill="#38bdf8">127.0.0.1:6379&gt;</tspan><tspan fill="#f8fafc"> <tspan>▍<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></tspan></text>
  </g>

  <!-- headline numbers -->
  <path d="M600 112V536" stroke="#1e293b"/>
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="636" y="188" font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="-1">320k+</text>
    <text x="638" y="220" font-size="19" fill="#cbd5e1">requests / sec, pipelined</text>
    <text x="636" y="330" font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="-1">39</text>
    <text x="638" y="362" font-size="19" fill="#cbd5e1">Redis commands</text>
    <text x="636" y="472" font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="-1">68</text>
    <text x="638" y="504" font-size="19" fill="#cbd5e1">tests, 0 dependencies</text>
  </g>
</svg>
