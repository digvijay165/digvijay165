  <text x="734" y="190" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" xml:space="preserve"><tspan fill="#0550ae">  role</tspan><tspan fill="#1f2328">: </tspan><tspan fill="#0a3069">&quot;Full-stack dev&quot;</tspan><tspan fill="#1f2328">,</tspan></text>
  <text x="716" y="222" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#656d76" fill-opacity="0.7">3</text>
  <text x="734" y="222" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" xml:space="preserve"><tspan fill="#0550ae">  based</tspan><tspan fill="#1f2328">: </tspan><tspan fill="#0a3069">&quot;Kota, India&quot;</tspan><tspan fill="#1f2328">,</tspan></text>
  <text x="716" y="254" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#656d76" fill-opacity="0.7">4</text>
  <text x="734" y="254" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" xml:space="preserve"><tspan fill="#0550ae">  stack</tspan><tspan fill="#1f2328">: [</tspan><tspan fill="#0a3069">&quot;React&quot;</tspan><tspan fill="#1f2328">, </tspan><tspan fill="#0a3069">&quot;Node&quot;</tspan><tspan fill="#1f2328">, </tspan><tspan fill="#0a3069">&quot;Java&quot;</tspan><tspan fill="#1f2328">],</tspan></text>
  <text x="716" y="286" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#656d76" fill-opacity="0.7">5</text>
  <text x="734" y="286" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" xml:space="preserve"><tspan fill="#0550ae">  liveApps</tspan><tspan fill="#1f2328">: </tspan><tspan fill="#953800">12</tspan><tspan fill="#1f2328">,</tspan></text>
  <text x="716" y="318" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#656d76" fill-opacity="0.7">6</text>
  <text x="734" y="318" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" xml:space="preserve"><tspan fill="#0550ae">  building</tspan><tspan fill="#1f2328">: </tspan><tspan fill="#0a3069">&quot;HTTP server&quot;</tspan><tspan fill="#1f2328">,</tspan></text>
  <text x="716" y="350" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#656d76" fill-opacity="0.7">7</text>
  <text x="734" y="350" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" xml:space="preserve"><tspan fill="#0550ae">  openTo</tspan><tspan fill="#1f2328">: </tspan><tspan fill="#0a3069">&quot;internships&quot;</tspan><tspan fill="#1f2328">,</tspan></text>
  <text x="716" y="382" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#656d76" fill-opacity="0.7">8</text>
  <text x="734" y="382" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" xml:space="preserve"><tspan fill="#1f2328">};</tspan></text>
  <rect x="758" y="367" width="9" height="19" fill="#4f46e5">
