<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Digvijay Singh. Full-stack developer &amp; CS student. I build fast, friendly web apps end to end, and lately the systems underneath them, in plain Java. Kota, India, 12 live apps, now: an HTTP server in Java. Open to internships.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2328" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="fade" cx="0.75" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="gridmask"><rect width="1200" height="500" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="500" rx="20"/></clipPath>
