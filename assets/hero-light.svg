      <stop offset="0" stop-color="#818cf8" stop-opacity="0.14"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.14"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="500" fill="url(#bg)"/>
    <rect width="1200" height="500" fill="url(#grid)" mask="url(#gridmask)"/>
    <circle cx="930" cy="230" r="420" fill="url(#glow0)"/>
    <circle cx="40" cy="540" r="260" fill="url(#glow1)"/>
    <rect x="20" y="0" width="1160" height="1" fill="url(#edge)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="499" rx="19.5" fill="none" stroke="#d0d7de"/>
  <g transform="translate(64 64)">
