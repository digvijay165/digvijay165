  <text x="734" y="158" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" xml:space="preserve"><tspan fill="#cf222e">const </tspan><tspan fill="#8250df">digvijay</tspan><tspan fill="#1f2328"> = {</tspan></text>
