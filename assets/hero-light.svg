    <circle cx="21" cy="17" r="4.5" fill="#1a7f37"/>
    <circle cx="21" cy="17" r="4.5" fill="none" stroke="#1a7f37" stroke-width="2">
      <animate attributeName="r" values="4.5;11" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="22" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="600" letter-spacing="1.2" fill="#1a7f37">OPEN TO INTERNSHIPS</text>
  </g>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <text x="60" y="184" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" fill="#1f2328" letter-spacing="-2.4">Digvijay Singh</text>
  <text x="63" y="236" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.4"><tspan fill="url(#ink)">Full-stack developer</tspan><tspan fill="#424a53" font-weight="600"> &amp; CS student</tspan></text>
  <text x="64" y="288" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#656d76">I build fast, friendly web apps end to end, and</text>
  <text x="64" y="320" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#656d76">lately the systems underneath them, in plain Java.</text>
