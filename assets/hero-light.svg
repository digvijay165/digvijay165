<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Digvijay Singh. Full-stack developer · CS student · Kota, India. I build fast, friendly web apps, and lately the tools underneath them, starting with Redis in plain Java. Open to internships.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#0f172a" fill-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="480" rx="28"/></clipPath>
    <radialGradient id="glow0" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.28"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="480" fill="url(#bg)"/>
    <rect width="1200" height="480" fill="url(#dots)"/>
    <circle cx="1000" cy="120" r="380" fill="url(#glow0)"/>
    <circle cx="60" cy="520" r="320" fill="url(#glow1)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="479" rx="28" fill="none" stroke="#e2e8f0"/>
  <g transform="translate(64 64)">
    <rect width="229" height="40" rx="20" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.45"/>
    <circle cx="24" cy="20" r="6" fill="#22c55e"/>
    <circle cx="24" cy="20" r="6" fill="none" stroke="#22c55e" stroke-width="2">
      <animate attributeName="r" values="6;14" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="42" y="26" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#15803d">Open to internships</text>
  </g>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <text x="60" y="200" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="800" fill="#0f172a" letter-spacing="-2.5">Digvijay Singh</text>
  <rect x="66" y="224" width="120" height="6" rx="3" fill="url(#ink)"/>
  <text x="64" y="280" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="600" fill="#334155">Full-stack developer · CS student · Kota, India</text>
  <text x="64" y="330" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#64748b">I build fast, friendly web apps, and lately the tools</text>
  <text x="64" y="364" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#64748b">underneath them, starting with Redis in plain Java.</text>
  <text x="64" y="424" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#4f46e5">▸ <tspan fill="#334155">now: writing an HTTP server from scratch in Java</tspan><tspan fill="#4f46e5">▍<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  <circle cx="1000" cy="250" r="170" fill="#4f46e5" fill-opacity="0.06" stroke="#4f46e5" stroke-opacity="0.18"/>
  <circle cx="1000" cy="250" r="214" fill="none" stroke="#0284c7" stroke-opacity="0.16" stroke-dasharray="3 8"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="6s" repeatCount="indefinite"/>
    <image x="840" y="40" width="320" height="400" href="data:image/svg+xml;base64,"/>
  </g>
</svg>
