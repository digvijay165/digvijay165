<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Digvijay Singh, student and front-end developer from Kota, India">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.30"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284c7"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1e293b" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <circle cx="980" cy="40" r="300" fill="url(#g1)"/>
    <circle cx="120" cy="330" r="260" fill="url(#g2)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="24" fill="none" stroke="#e2e8f0"/>

  <!-- intro -->
  <text x="72" y="96" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" fill="#0284c7">~/digvijay165 <tspan fill="#64748b">$ whoami</tspan></text>
  <text x="70" y="168" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="#0f172a" letter-spacing="-1">Digvijay Singh</text>
  <rect x="72" y="188" width="132" height="5" rx="2.5" fill="url(#ink)"/>
  <text x="72" y="232" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#334155">Student &amp; front-end developer · Kota, India</text>
  <text x="72" y="270" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#64748b">&gt; building web apps people actually use<tspan fill="#0284c7">▍<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <!-- orbit + code window -->
  <g transform="translate(930 160)">
    <ellipse rx="190" ry="62" fill="none" stroke="#818cf8" stroke-opacity="0.35" stroke-dasharray="3 7" transform="rotate(-14)"/>
    <ellipse rx="150" ry="118" fill="none" stroke="#0284c7" stroke-opacity="0.22" transform="rotate(24)"/>
    <circle r="6" fill="#0284c7">
      <animateMotion dur="9s" repeatCount="indefinite" path="M190 0 A190 62 0 1 1 -190 0 A190 62 0 1 1 190 0" rotate="0"/>
    </circle>
  </g>
  <g transform="translate(800 78)">
    <rect width="260" height="168" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <path d="M0 14 a14 14 0 0 1 14 -14 h232 a14 14 0 0 1 14 14 v16 h-260 z" fill="#f1f5f9"/>
    <circle cx="20" cy="15" r="5" fill="#ff5f57"/><circle cx="38" cy="15" r="5" fill="#febc2e"/><circle cx="56" cy="15" r="5" fill="#28c840"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14">
      <text x="20" y="62"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> dev</tspan><tspan fill="#64748b"> = {</tspan></text>
      <text x="38" y="86"><tspan fill="#334155">stack</tspan><tspan fill="#64748b">: </tspan><tspan fill="#0284c7">"React + TS"</tspan><tspan fill="#64748b">,</tspan></text>
      <text x="38" y="110"><tspan fill="#334155">server</tspan><tspan fill="#64748b">: </tspan><tspan fill="#0284c7">"Node"</tspan><tspan fill="#64748b">,</tspan></text>
      <text x="38" y="134"><tspan fill="#334155">openTo</tspan><tspan fill="#64748b">: </tspan><tspan fill="#0284c7">"internships"</tspan></text>
      <text x="20" y="156" fill="#64748b">}</text>
    </g>
  </g>
  <g transform="translate(742 50)"><g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4.2s" repeatCount="indefinite"/>
    <rect x="-32.0" y="-14" width="64" height="28" rx="14" fill="#ffffff" stroke="#0284c7" stroke-opacity="0.55"/>
    <circle cx="-19.0" cy="0" r="3" fill="#0284c7"/>
    <text x="-10.0" y="4.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">React</text>
  </g></g>
  <g transform="translate(1010 44)"><g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5.1s" repeatCount="indefinite"/>
    <rect x="-51.0" y="-14" width="102" height="28" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.55"/>
    <circle cx="-38.0" cy="0" r="3" fill="#7c3aed"/>
    <text x="-29.0" y="4.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">TypeScript</text>
  </g></g>
  <g transform="translate(1080 268)"><g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4.6s" repeatCount="indefinite"/>
    <rect x="-39.5" y="-14" width="79" height="28" rx="14" fill="#ffffff" stroke="#0284c7" stroke-opacity="0.55"/>
    <circle cx="-26.5" cy="0" r="3" fill="#0284c7"/>
    <text x="-17.5" y="4.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Node.js</text>
  </g></g>
  <g transform="translate(712 266)"><g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5.6s" repeatCount="indefinite"/>
    <rect x="-43.5" y="-14" width="87" height="28" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.55"/>
    <circle cx="-30.5" cy="0" r="3" fill="#7c3aed"/>
    <text x="-21.5" y="4.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Three.js</text>
  </g></g>
  <g transform="translate(900 286)"><g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4.9s" repeatCount="indefinite"/>
    <rect x="-51.0" y="-14" width="102" height="28" rx="14" fill="#ffffff" stroke="#0284c7" stroke-opacity="0.55"/>
    <circle cx="-38.0" cy="0" r="3" fill="#0284c7"/>
    <text x="-29.0" y="4.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">PostgreSQL</text>
  </g></g>
