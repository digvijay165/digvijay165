  <circle cx="510" cy="387" r="20" fill="#dc2626" fill-opacity="0.14" stroke="#dc2626" stroke-opacity="0.5"/>
  <svg x="499" y="376" width="22" height="22" viewBox="0 0 24 24"><g fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></g></svg>
