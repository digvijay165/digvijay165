  <text x="32" y="476" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#334155">A Redis-compatible server in plain Java: one</text>
  <text x="32" y="504" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#334155">NIO event loop, RESP pipelining, 39 commands</text>
  <text x="32" y="532" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#334155">and crash-safe persistence.</text>
