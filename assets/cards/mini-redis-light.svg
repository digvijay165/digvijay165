<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" width="560" height="640" role="img" aria-label="mini-redis: A Redis-compatible server in plain Java: one NIO event loop, RESP pipelining, 39 commands and crash-safe persistence. Built with Java 21, NIO, JUnit, Maven.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#0f172a" fill-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="560" height="640" rx="28"/></clipPath>
    <radialGradient id="glow0" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0.28"/><stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="560" height="640" fill="url(#bg)"/>
    <rect width="560" height="640" fill="url(#dots)"/>
    <circle cx="560" cy="640" r="300" fill="url(#glow0)"/>
  </g>
  <rect x="0.5" y="0.5" width="559" height="639" rx="28" fill="none" stroke="#e2e8f0"/>
