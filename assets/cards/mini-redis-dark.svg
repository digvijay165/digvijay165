<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 612" width="560" height="612" role="img" aria-label="mini-redis: A Redis-compatible server in plain Java: one NIO event loop, RESP pipelining, 39 commands and crash-safe persistence. Built with Java 21, NIO, JUnit, Maven.">
