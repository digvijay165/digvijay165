<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3730a3"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2f63"/>
      <stop offset="1" stop-color="#1e1b3a"/>
    </linearGradient>
  </defs>

  <!-- floating code symbols -->
  <g font-family="'Fira Code', Consolas, monospace" font-weight="700">
    <text x="40" y="130" font-size="34" fill="#8b5cf6">&lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="305" y="115" font-size="32" fill="#0ea5e9">{ }
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
    </text>
    <text x="330" y="245" font-size="30" fill="#a78bfa">;
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="2.8s" begin="1.1s" repeatCount="indefinite"/>
    </text>
    <text x="45" y="270" font-size="26" fill="#38bdf8">( )
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="3.2s" begin="0.3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- sparkles -->
  <g fill="#fbbf24">
    <path d="M300 60 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M85 330 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M335 330 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="0.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- shadow -->
  <ellipse cx="200" cy="478" rx="88" ry="11" fill="#000" opacity="0.12"/>

  <!-- whole character bobs gently -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" repeatCount="indefinite"/>

    <!-- legs -->
    <rect x="166" y="392" width="28" height="62" rx="12" fill="#334155"/>
    <rect x="206" y="392" width="28" height="62" rx="12" fill="#334155"/>
    <!-- sneakers -->
    <path d="M156 452 q0 -14 24 -14 q20 0 20 14 q0 10 -22 10 q-22 0 -22 -10 z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M200 452 q0 -14 24 -14 q20 0 20 14 q0 10 -22 10 q-22 0 -22 -10 z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M160 455 h38" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
    <path d="M204 455 h38" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>

    <!-- hood behind -->
    <ellipse cx="200" cy="262" rx="72" ry="24" fill="#2e2a6e"/>

    <!-- hoodie body -->
    <path d="M128 305 Q128 266 166 258 L234 258 Q272 266 272 305 L278 404 Q200 420 122 404 Z" fill="url(#hoodie)"/>
    <!-- pocket -->
    <path d="M160 385 Q200 375 240 385 L236 404 Q200 410 164 404 Z" fill="#2e2a6e" opacity="0.7"/>

    <!-- neck -->
    <rect x="188" y="238" width="24" height="24" rx="6" fill="#f6cdb8"/>

    <!-- hoodie strings -->
    <path d="M186 262 L182 300" stroke="#e0e7ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M214 262 L218 300" stroke="#e0e7ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="182" cy="302" r="3.5" fill="#c4b5fd"/>
    <circle cx="218" cy="302" r="3.5" fill="#c4b5fd"/>

    <!-- headphones around neck -->
    <path d="M150 258 Q200 300 250 258" fill="none" stroke="#6d28d9" stroke-width="7" stroke-linecap="round"/>
    <rect x="136" y="246" width="24" height="34" rx="10" fill="#a78bfa" transform="rotate(-18 148 263)"/>
    <rect x="141" y="250" width="12" height="26" rx="6" fill="#5b21b6" transform="rotate(-18 148 263)"/>
    <rect x="240" y="246" width="24" height="34" rx="10" fill="#a78bfa" transform="rotate(18 252 263)"/>
    <rect x="247" y="250" width="12" height="26" rx="6" fill="#5b21b6" transform="rotate(18 252 263)"/>

    <!-- arms -->
    <path d="M148 286 Q118 330 146 356" fill="none" stroke="url(#hoodie)" stroke-width="30" stroke-linecap="round"/>
    <path d="M252 286 Q282 330 254 356" fill="none" stroke="url(#hoodie)" stroke-width="30" stroke-linecap="round"/>

    <!-- laptop glow -->
    <ellipse cx="200" cy="300" rx="85" ry="30" fill="url(#glow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- laptop (lid facing us) -->
    <rect x="138" y="302" width="124" height="82" rx="9" fill="url(#lid)" stroke="#64748b" stroke-width="2"/>
    <path d="M128 384 L272 384 L264 394 Q200 398 136 394 Z" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
    <!-- sticker -->
    <rect x="172" y="324" width="56" height="36" rx="10" fill="#1e1b4b"/>
    <text x="200" y="349" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-weight="700" font-size="18" fill="#a78bfa">&lt;/&gt;</text>
    <circle cx="246" cy="372" r="5" fill="#0ea5e9"/>
    <circle cx="156" cy="316" r="4" fill="#fbbf24"/>

    <!-- hands holding laptop -->
    <circle cx="141" cy="350" r="13" fill="#f6cdb8"/>
    <circle cx="259" cy="350" r="13" fill="#f6cdb8"/>

    <!-- HEAD -->
    <!-- back hair -->
    <ellipse cx="200" cy="168" rx="104" ry="98" fill="url(#hair)"/>
    <!-- ears -->
    <circle cx="117" cy="190" r="14" fill="#f6cdb8"/>
    <circle cx="283" cy="190" r="14" fill="#f6cdb8"/>
    <!-- face -->
    <ellipse cx="200" cy="184" rx="84" ry="76" fill="#ffe3d3"/>
    <!-- screen light on chin -->
    <ellipse cx="200" cy="245" rx="55" ry="14" fill="#7dd3fc" opacity="0.12"/>

    <!-- spiky top hair -->
    <path d="M150 90 Q140 50 175 62 Q180 28 205 52 Q228 26 238 62 Q268 50 255 92 Z" fill="url(#hair)"/>
    <!-- ahoge -->
    <path d="M202 58 Q210 18 248 26 Q218 34 210 62 Z" fill="#3b2f63"/>
    <!-- bangs -->
    <path d="M108 178 Q100 88 200 74 Q300 88 292 178 Q280 146 260 138 L266 166 Q244 132 222 128 L218 156 Q198 124 176 130 L170 158 Q156 132 138 140 L142 168 Q124 152 108 178 Z" fill="url(#hair)"/>
    <!-- hair shine -->
    <path d="M150 104 Q175 90 200 92" fill="none" stroke="#8b7fc7" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

    <!-- eyebrows -->
    <path d="M148 166 Q164 160 178 166" fill="none" stroke="#2a2340" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M222 166 Q236 160 252 166" fill="none" stroke="#2a2340" stroke-width="3.5" stroke-linecap="round"/>

    <!-- open eyes (blink) -->
    <g>
      <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.93;0.96;1" dur="4s" repeatCount="indefinite"/>
      <ellipse cx="164" cy="199" rx="20" ry="24" fill="#fff"/>
      <ellipse cx="164" cy="201" rx="16" ry="20" fill="url(#iris)"/>
      <ellipse cx="164" cy="203" rx="8" ry="10" fill="#1e1b4b"/>
      <circle cx="157" cy="192" r="6" fill="#fff"/>
      <circle cx="170" cy="210" r="3" fill="#fff" opacity="0.9"/>
      <path d="M142 186 Q164 168 186 186" fill="none" stroke="#1e1b3a" stroke-width="4.5" stroke-linecap="round"/>

      <ellipse cx="236" cy="199" rx="20" ry="24" fill="#fff"/>
      <ellipse cx="236" cy="201" rx="16" ry="20" fill="url(#iris)"/>
      <ellipse cx="236" cy="203" rx="8" ry="10" fill="#1e1b4b"/>
      <circle cx="229" cy="192" r="6" fill="#fff"/>
      <circle cx="242" cy="210" r="3" fill="#fff" opacity="0.9"/>
      <path d="M214 186 Q236 168 258 186" fill="none" stroke="#1e1b3a" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <!-- closed eyes -->
    <g opacity="0" fill="none" stroke="#1e1b3a" stroke-width="4" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.93;0.96;1" dur="4s" repeatCount="indefinite"/>
      <path d="M146 202 Q164 214 182 202"/>
      <path d="M218 202 Q236 214 254 202"/>
    </g>

    <!-- blush -->
    <ellipse cx="140" cy="228" rx="14" ry="7" fill="#fb7185" opacity="0.35"/>
    <ellipse cx="260" cy="228" rx="14" ry="7" fill="#fb7185" opacity="0.35"/>
    <!-- nose -->
    <path d="M199 220 q2 3 4 0" fill="none" stroke="#e8a58a" stroke-width="2" stroke-linecap="round"/>
    <!-- smile -->
    <path d="M188 232 Q200 246 212 232 Q200 238 188 232 Z" fill="#9f3a3a" stroke="#7c2d2d" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
